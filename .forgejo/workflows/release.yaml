name: Release

on:
  push:
    branches: 
      - "main"
    path_ignore:
      - '.forgejo/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  preparation:
    runs-on: arch
    outputs:
      version: ${{ steps.version.outputs.version }}
      notesmd: ${{ steps.prepare.outputs.notesmd }}
      webhookmd: ${{ steps.prepare.outputs.webhookmd }}
      archiveslist: ${{ steps.prepare.outputs.archiveslist }}
    steps:
      - name: Calculer la prochaine version
        id: version
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -H "Authorization: token $TOKEN" \
            "$API/releases?limit=50" -o releases.json
          VERSION="$(node -e '
            const releases = JSON.parse(require("fs").readFileSync("releases.json", "utf8"));
            const re = /^v(\d+)\.(\d+)\.(\d+)$/;
            const semver = releases
              .filter(r => re.test(r.tag_name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (semver.length === 0) {
              console.log("v0.0.1");
            } else {
              const [, major, minor, patch] = semver[0].tag_name.match(re);
              console.log("v" + major + "." + minor + "." + (Number(patch) + 1));
            }
          ')"
          echo "Version : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare variables
        id: prepare
        run: |
          NOTES_MD="/tmp/notes.md"
          WEBHOOK_MD="/tmp/webhook.md"
          ARCHIVES_LIST="/tmp/archives.list"

          echo "notesmd=$NOTES_MD" >> "$GITHUB_OUTPUT"
          echo "webhookmd=$WEBHOOK_MD" >> "$GITHUB_OUTPUT"
          echo "archiveslist=$ARCHIVES_LIST" "$GITHUB_OUTPUT"

  arch-compile:
    runs-on: arch
    needs:
      - prepare
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compile
        id: compile
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          make cleanbuild NODEBUG=1

          NAME="bin/archlinux_x86-64_docc-to-md-$VERSION.uwu"
          mv bin/main.uwu "$NAME"
          echo "path=$( realpath "$NAME" )" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: ${{ steps.compile.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  debian-compile:
    runs-on: debian
    needs:
      - prepare
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Compile
        id: compile
        env:
          VERSION: ${{ needs.prepare.version.version }}
        run: |
          set -euo pipefail

          make cleanbuild NODEBUG=1

          NAME="bin/debian_x86-64_docc-to-md-$VERSION.uwu"
          mv bin/main.uwu "$NAME"
          echo "path=$( realpath "$NAME" )" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: ${{ steps.compile.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs:
      - prepare
      - arch-compile
      - debian-compile
    runs-on: arch
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifacts@v4
        with:
          pattern: *
          merge-multiple: true
          path: release/

      - name: Check artifacts
        run: |
          ls release/ -la

      - name: Préparer le README et l'archive
        id: build
        env:
          TZ: Europe/Paris
          VERSION: ${{ needs.prepare.outputs.version }}
          TREE: ${{ github.server_url }}/${{ github.repository }}/src/branch/main
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          NAME="${REPO}-${VERSION}"
          STAMP="$(date +'%d/%m/%Y à %H:%M:%S %Z')"

          {
            echo "# Version $VERSION"
            printf '\n\nThis is the **version %s** of the project' "$VERSION"
          } >> "$NOTES_MD"

          printf 'La version [**%s**](%s/tag/%s) de [**%s**](%s) a été publiée\n\n' "$VERSION" "$RELEASES" "$VERSION" "$REPO_NAME" "$REPO_URL" >> "$WEBHOOK_MD"
          printf '\n\n## Information de build\n\nArchivé le : %s\n' "$STAMP" >> "$NOTES_MD"

          echo "==== NOTES MD ===="
          cat "$NOTES_MD"

          echo "==== WEBHOOK MD ====="
          cat "$WEBHOOK_MD"

      - name: Créer la release et joindre les artifacts
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES_MD: ${{ needs.prepare.outputs.notesmd }}
        run: |
          set -euo pipefail

          node -e '
            const fs = require("fs");
            fs.writeFileSync("release.json", JSON.stringify({
              tag_name: process.env.VERSION,
              target_commitish: process.env.GITHUB_SHA,
              name: process.env.VERSION,
              body: fs.readFileSync(process.env.NOTES_MD, "utf8"),
              draft: false,
              prerelease: false,
            }));
          '

          curl --fail-with-body -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json \
            "$API/releases" -o created.json

          RELEASE_ID="$(node -e '
            const release = require("./created.json");
            console.log(release.id);
          ')"

          echo "Release $VERSION créée (id: $RELEASE_ID)"

          shopt -s nullglob
          for file in release/*; do
            filename="$(basename "$file")"
            encoded_name="$(node -e '
              console.log(encodeURIComponent(process.argv[1]));
            ' "$filename")"

            echo "Attachement de $filename…"

            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$file" \
              "$API/releases/$RELEASE_ID/assets?name=$encoded_name" \
              -o "asset-$filename.json"

            echo "$filename attaché"
          done

      - name: Send discord webhook
        uses: ./.forgejo/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          bot_avatar_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/40916a7c80110244c709834c59a9f179830540e0/avatars/yksneerg.png'
          bot_name: ${{ github.repository }}
          title: 'Release published'
          title_url: ${{ github.server_url }}/${{ github.repository }}
          description_file: ${{ needs.prepare.outputs.webhookmd }}
          footer_text: 'Forgejo Actions'
          footer_icon_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/1745b18f7115e22905923ac5937ccd2d1ab00be0/logos/forgejo/logo.png'
