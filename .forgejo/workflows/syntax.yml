name: Check Project syntax health

on:
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: arch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo pacman -Sy --noconfirm time

      - name: Modify makefile
        run: |
          set -euo pipefail

          sed -i 's/\(FLAGS=.*\)/\1 -Werror/' makefile
          sed -i 's/\(CLEANBUILD_FLAGS=.*\)/\1 -Werror/' makefile
          sed -i 's/ ?-DNODEBUG//' makefile

          cat makefile

      - name: Compile and see
        run: |
          make DEBUG=1
          make clean
          make cleanbuild DEBUG=1

      - name: Check program against itself
        run: |
          set -euo pipefail

          echo "Testing program with all possible arguments against itself"
          set +e
          /usr/bin/time -f 'Peak RAM: %M KiB' -o peak_ram.txt \
            timeout --kill-after=10s 5m \
            ./bin/main.uwu \
              --src src \
              --dest test/out \
              -d \
              --dump test/dump \
              --verbose-registration \
              --enable-commentdoc \
              --work test/work

          status=$?
          set -e

          cat peak_ram.txt
          if [ "$status" -eq 124 ]; then
            echo "::error::Program exceeded the 5 minute limit and was interrupted."
            exit 124
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
