name: Check Project syntax health

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: arch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Modify makefile
        run: |
          set -euo pipefail

          sed -i 's/\(FLAGS=.*\)/\1 -Werror/' makefile
          sed -i 's/\(CLEANBUILD_FLAGS=.*\)/\1 -Werror/' makefile
          sed -i 's/ ?-DNODEBUG//' makefile

          cat makefile

      - name: Compile and see
        run: |
          make DEBUG=1
          make clean
          make cleanbuild DEBUG=1

      - name: Check program against itself
        run: |
          set -euo pipefail

          echo "Testing program with all possible arguments against itself"
          ./bin/main.uwu --src src --dest test/out -d --dump test/dump --verbose-registration --enable-commentdoc --work test/work
