name: Check Project syntax health

on:
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  syntax:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: arch
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'powershell' || 'bash' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: |
          sudo pacman -Sy --noconfirm time

      - name: Modify makefile
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail

          sed -i 's/\(FLAGS=.*\)/\1 -Werror/' makefile
          sed -i 's/\(CLEANBUILD_FLAGS=.*\)/\1 -Werror/' makefile
          sed -i 's/ ?-DNODEBUG//' makefile

          cat makefile

      - name: Compile and see
        if: matrix.os != 'windows-latest'
        run: |
          make DEBUG=1
          make clean
          make cleanbuild DEBUG=1

      - name: Check program against itself
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail

          echo "Testing program with all possible arguments against itself"
          set +e
          /usr/bin/time -f 'Peak RAM: %M KiB' -o peak_ram.txt \
            timeout --kill-after=10s 5m \
            ./bin/main.uwu \
              --src src \
              --dest test/out \
              -d \
              --dump test/dump \
              --verbose-registration \
              --enable-commentdoc \
              --work test/work

          status=$?
          set -e

          cat peak_ram.txt
          if [ "$status" -eq 124 ]; then
            echo "::error::Program exceeded the 5 minute limit and was interrupted."
            exit 124
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -S . -B build-cmake -G "Visual Studio 17 2022" -A x64 `
            -DUWU_WERROR=ON -DUWU_NODEBUG=OFF -DUWU_SANITIZE=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and see (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake --build build-cmake --config Debug --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-cmake --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check program against itself (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Testing program with all possible arguments against itself"

          $argsList = @(
            "--src", "src", "--dest", "test/out", "-d",
            "--dump", "test/dump", "--verbose-registration",
            "--enable-commentdoc", "--work", "test/work"
          )

          $proc = Start-Process -FilePath ".\bin\main.uwu.exe" -ArgumentList $argsList -NoNewWindow -PassThru
          $null = $proc.Handle   # nécessaire pour que ExitCode ne soit pas $null
          $peakBytes = 0
          $start = Get-Date

          while (-not $proc.HasExited) {
            $proc.Refresh()
            if ($proc.PeakWorkingSet64 -gt $peakBytes) { $peakBytes = $proc.PeakWorkingSet64 }
            if (((Get-Date) - $start).TotalMinutes -ge 5) {
              Stop-Process -Id $proc.Id -Force
              Write-Host "::error::Program exceeded the 5 minute limit and was interrupted."
              exit 124
            }
            Start-Sleep -Milliseconds 100
          }
          $proc.WaitForExit()

          Write-Host ("Peak RAM: {0} KiB" -f [math]::Round($peakBytes / 1024))
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }